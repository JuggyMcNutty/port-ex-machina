; The launcher's own settings. Deliberately separate from the game's
; DeusEx.ini so that resetting the game configuration cannot take the path to
; the game files with it. Staging installs this only when there is none, so
; your edits survive a rebuild.

[Launcher]
; Where your own Deus Ex files are: the folder holding System/, Maps/,
; Textures/... Empty means a "game" folder beside the launcher. The install
; screen shows this path and lists what it still needs.
GameDir=

; Names the config file (<Package>.ini) and the localisation package read from
; <GameDir>/System.
Package=DeusEx

; What to exec once configuration is settled. Relative paths resolve against
; the launcher's own directory.
GameCommand=./run-game.sh
