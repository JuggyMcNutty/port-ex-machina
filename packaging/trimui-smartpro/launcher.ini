; The launcher's own settings. Deliberately separate from the game's
; DeusEx.ini so that the safe-mode "reset all configuration" checkbox cannot
; take the path to the game files with it.

[Launcher]
; Where you put your own Deus Ex files. The install screen shows this path and
; lists what it still needs.
GameDir=/mnt/SDCARD/Roms/PORTS/DeusEx

; Names the config file (<Package>.ini) and the localisation package read from
; <GameDir>/System.
Package=DeusEx

; What to exec once configuration is settled. Relative paths resolve against
; the launcher's own directory. Point this at a real runtime when there is one.
GameCommand=./run-game.sh
