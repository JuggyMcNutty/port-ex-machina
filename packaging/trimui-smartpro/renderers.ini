; Renderer candidates offered on the video screen.
;
; The original enumerates Win32 3D devices and re-execs itself with
; -testrendev= per candidate (docs/re/wizard.md, Renderer page). There is no
; Win32 here and no engine to probe, so the candidates are declared instead.
; The chosen class name is still written to [Engine.Engine] GameRenderDevice
; exactly as before -- that key is the only channel to the engine, so it stays
; honest regardless of how the list was produced.
;
; Descriptions come from <GameDir>/System/Startup.int [Descriptions] when the
; class is one the game knows about.

[Renderers]
Device=OpenGLDrv.OpenGLRenderDevice
Device=SoftDrv.SoftwareRenderDevice

[OpenGLDrv.OpenGLRenderDevice]
Label=OpenGL (hardware)
Certified=True

[SoftDrv.SoftwareRenderDevice]
Label=Software renderer
Certified=False
