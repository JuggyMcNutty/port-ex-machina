; The renderers the Video tab lists, and what each needs.
;
; Two facts decide whether one can be chosen, and the launcher shows both:
;
;   EngineType  the Settings.json RenderDevice.Type value that selects it in
;               Surreal Engine. Empty means this engine build has no backend
;               for it -- set it only when the engine can actually run it.
;   Requires    the graphics API it needs from the device: vulkan, gles, gl
;               or none. Checked at startup by the launcher's GPU probe.
;
; The choice goes to Settings.json, not to DeusEx.ini GameRenderDevice:
; Surreal Engine overrides that ini key with its own device class.

[Renderers]
Renderer=Vulkan
Renderer=GLES
Renderer=Software

[Vulkan]
Label=Vulkan
EngineType=Vulkan
Requires=vulkan
Description=Surreal Engine's main renderer. On the Smart Pro's PowerVR GE8300 it runs on the port's non-bindless texture path, with textures the GPU cannot sample decoded on the CPU.

[GLES]
Label=OpenGL ES
; Empty until the fork's GLES backend lands (engine-patches/0004).
EngineType=
Requires=gles
Description=OpenGL ES 3 through the device's EGL driver. Surreal Engine's OpenGL renderer targets desktop OpenGL 3.2, which this device does not have; a GLES port of it is planned.

[Software]
Label=Software
EngineType=
Requires=none
Description=Rendering on the CPU, with no GPU driver involved. Surreal Engine has no software renderer, so there is nothing to select.
