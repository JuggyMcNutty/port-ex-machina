name: ports

# The jobs every repository's CI runs (docs/DEVELOPMENT.md#ci), called by
# each one's .github/workflows/build.yml: this repository's on a push of its
# pins, DXEngine's and each launcher branch's on a pull request or by hand.
# Every step that builds is a workspace script (scripts/dx.sh,
# scripts/ci.sh), so a run can be repeated on this machine; adding a build
# step means editing a script, not this file. The repositories are private:
# each run reads its own with GitHub's token, the others with RELEASES_TOKEN,
# which every caller passes on (secrets: inherit).

on:
  workflow_call:
    inputs:
      ports:
        description: "pins (the workspace's pinned set), all (every pinned port), a port, or main (the recreation)"
        type: string
        required: true
    secrets:
      RELEASES_TOKEN:
        required: false
    outputs:
      release:
        description: "true when the run publishes a release"
        value: ${{ jobs.plan.outputs.release }}
      workspace:
        description: "the workspace's commit the run built"
        value: ${{ jobs.plan.outputs.workspace }}

permissions:
  contents: read

# bash -eo pipefail: a build piped into its log still fails the step.
defaults:
  run:
    shell: bash

jobs:
  # What the run builds, decided once: the commits every later job checks
  # out -- the caller's own repository at the event's commit, the others at
  # the workspace's pins -- and, for the workspace's pins, whether code
  # changed at all.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      workspace: ${{ steps.plan.outputs.workspace }}
      engine: ${{ steps.plan.outputs.engine }}
      ports: ${{ steps.plan.outputs.ports }}
      matrix: ${{ steps.plan.outputs.matrix }}
      recreation: ${{ steps.plan.outputs.recreation }}
      main: ${{ steps.plan.outputs.main }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: the workspace
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'port-ex-machina' && github.repository || 'JuggyMcNutty/port-ex-machina' }}
          ref: ${{ github.event.repository.name == 'port-ex-machina' && github.sha || 'main' }}
          token: ${{ (github.event.repository.name == 'port-ex-machina' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          fetch-depth: 0
          path: port-ex-machina
          persist-credentials: false

      - id: plan
        env:
          CI_PORTS: ${{ inputs.ports }}
          CI_REPO: ${{ github.repository }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
          CI_BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: port-ex-machina/scripts/ci.sh plan | tee -a "$GITHUB_OUTPUT"

  # One port: its launcher, its engine, staged, tested, packed. The layout is
  # the scripts' own (docs/DEVELOPMENT.md#the-repositories), each repository
  # a plain checkout at the commit plan chose.
  port:
    needs: plan
    if: needs.plan.outputs.ports != '0'
    name: ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PORT: ${{ matrix.port }}
      # The Smart Pro's libraries from TrimUI's SDK, not the device
      # (its ports/trimui-smartpro/fetch-sysroot.sh).
      DX_SMARTPRO_SYSROOT: ${{ matrix.port == 'trimui-smartpro' && 'sdk' || '' }}
    steps:
      - name: the workspace
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'port-ex-machina' && github.repository || 'JuggyMcNutty/port-ex-machina' }}
          ref: ${{ needs.plan.outputs.workspace }}
          token: ${{ (github.event.repository.name == 'port-ex-machina' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          path: port-ex-machina
          persist-credentials: false

      - name: the engine
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'DXEngine' && github.repository || 'JuggyMcNutty/DXEngine' }}
          ref: ${{ needs.plan.outputs.engine }}
          token: ${{ (github.event.repository.name == 'DXEngine' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          path: DXEngine
          persist-credentials: false

      - name: the launcher
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'deusex-launcher' && github.repository || 'JuggyMcNutty/deusex-launcher' }}
          ref: ${{ matrix.launcher }}
          token: ${{ (github.event.repository.name == 'deusex-launcher' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          path: deusex-launcher/${{ matrix.port }}
          persist-credentials: false

      - run: port-ex-machina/scripts/ci.sh link "$PORT"

      # wayland-scanner: without it SDL3 builds no Wayland backend, and says
      # nothing. For the host test build, Vulkan's and EGL's headers (the GPU
      # probe) and X11's: Ubuntu has no SDL3, so it is built from its source,
      # which refuses a system without a window system's. OpenAL, GL, EGL, X11
      # and Xi, D-Bus, GLib, fontconfig and FreeType: what the engine loads
      # for its smoke run.
      - name: packages
        run: >
          port-ex-machina/scripts/ci-apt-install.sh
          libwayland-bin libvulkan-dev libegl-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libopenal1 libopengl0 libegl1 libx11-6 libxi6 libdbus-1-3 libglib2.0-0t64 libfontconfig1 libfreetype6

      # The pinned downloads, saved as soon as deps has them, so a run that
      # fails later still keeps them. No restore-keys: Debian's package
      # indexes are not pinned, and a stale one names packages long gone.
      - name: restore the downloads
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: deps/cache
          key: deps-${{ matrix.port }}-${{ hashFiles(format('deusex-launcher/{0}/ports/{0}/port.sh', matrix.port), format('deusex-launcher/{0}/ports/{0}/fetch-sysroot.sh', matrix.port), format('deusex-launcher/{0}/cmake/deps.lock', matrix.port), 'port-ex-machina/scripts/ci.sh', 'port-ex-machina/scripts/lib/common.sh') }}

      # Wine, for the Windows port: the pinned Proton, whose wine is old-style
      # WoW64 -- even wineboot goes through its 32-bit loader, so 32-bit glibc
      # -- and an X display. (A command's output is taken into a variable
      # first: inside echo's arguments its failure would pass unnoticed.)
      - name: Wine
        if: matrix.port == 'windows-x86_64'
        run: |
          sudo dpkg --add-architecture i386
          port-ex-machina/scripts/ci-apt-install.sh libc6:i386
          sudo install -d -m 1777 /tmp/.X11-unix
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          proton="$(port-ex-machina/scripts/ci.sh proton)"
          echo "DX_PROTON=$proton" >> "$GITHUB_ENV"

      # Its own limit: a Wine prefix that never comes up (wineboot) would
      # otherwise hold the job for all of it.
      - name: deps
        id: deps
        timeout-minutes: 30
        run: port-ex-machina/scripts/dx.sh deps "$PORT"

      - name: save the downloads
        if: always() && steps.deps.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: deps/cache
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: build
        run: |
          mkdir -p "build/$PORT"
          port-ex-machina/scripts/dx.sh build "$PORT" 2>&1 | tee "build/$PORT/ci-build.log"

      - name: stage
        run: port-ex-machina/scripts/dx.sh stage "$PORT"

      - name: smoke
        if: matrix.port == 'linux-x86_64'
        run: |
          ldd build/linux-x86_64/app/DXEngine
          build/linux-x86_64/app/DXEngine --version

      - name: test
        timeout-minutes: 40
        run: |
          port-ex-machina/scripts/dx.sh test "$PORT" 2>&1 | tee "build/$PORT/ci-test.log" ||
              { port-ex-machina/scripts/ci.sh failed "build/$PORT/ci-test.log"; exit 1; }

      - name: skipped tests
        run: port-ex-machina/scripts/ci.sh skips "build/$PORT/ci-test.log" test_gamefiles test_ui_scripts

      - name: package
        run: port-ex-machina/scripts/ci.sh package "$PORT"

      # The port's three files, one artifact named for it: the app, the
      # engine alone, the launcher alone (each a tarball or zip of its own,
      # the programs' modes kept). Kept two days: a private repository's
      # artifacts share a small quota, and the releases keep the files.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.port }}
          retention-days: 2
          path: |
            build/${{ matrix.port }}/DX-${{ matrix.port }}.*
            build/${{ matrix.port }}/DXEngine-${{ matrix.port }}.*
            build/${{ matrix.port }}/DXLauncher-${{ matrix.port }}.*
          if-no-files-found: error

      # Last, so a warning still leaves the tests' verdict and the artifact.
      - name: warnings
        run: port-ex-machina/scripts/ci.sh warnings "build/$PORT/ci-build.log"

  # The launcher's main: the original recreated, a build with the machine's
  # own compiler and SDL2, and its tests (scripts/recreation.sh test).
  recreation:
    needs: plan
    if: needs.plan.outputs.recreation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: the workspace
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'port-ex-machina' && github.repository || 'JuggyMcNutty/port-ex-machina' }}
          ref: ${{ needs.plan.outputs.workspace }}
          token: ${{ (github.event.repository.name == 'port-ex-machina' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          path: port-ex-machina
          persist-credentials: false

      - name: the launcher's main
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.repository.name == 'deusex-launcher' && github.repository || 'JuggyMcNutty/deusex-launcher' }}
          ref: ${{ needs.plan.outputs.main }}
          token: ${{ (github.event.repository.name == 'deusex-launcher' || !secrets.RELEASES_TOKEN) && github.token || secrets.RELEASES_TOKEN }}
          path: deusex-launcher/main
          persist-credentials: false

      - run: port-ex-machina/scripts/ci.sh link main

      # fonts-wine: Wine's MS Sans Serif, the wizard's first choice of font.
      - name: packages
        run: port-ex-machina/scripts/ci-apt-install.sh libsdl2-dev libsdl2-ttf-dev fonts-wine

      - name: test
        run: |
          mkdir -p build/main
          port-ex-machina/scripts/recreation.sh test 2>&1 | tee build/main/ci-test.log

      - name: skipped tests
        run: port-ex-machina/scripts/ci.sh skips build/main/ci-test.log test_gamefiles
